<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>Portfolio WebGL Host</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070a}
    body{font-family:Arial,sans-serif;color:#f3f7f4}
    #unity-container{position:absolute;inset:0;width:100%;height:100%;background:#05070a}
    #unity-canvas{display:block;width:100%!important;height:100%!important;background:#05070a}
    #status{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#05070a}
    #status[hidden]{display:none}
    .status-card{width:min(520px,100%);padding:24px;border:1px solid #ffffff18;border-radius:18px;background:#0b1017;text-align:center}
    .eyebrow{margin:0 0 10px;color:#8ff5d0;font:700 10px/1.4 monospace;letter-spacing:.14em}
    #status-title{margin:0 0 10px;font-size:24px}
    #status-text{margin:0;color:#8995a6;font-size:13px;line-height:1.6}
    #progress{height:3px;margin-top:18px;background:#ffffff10;overflow:hidden;border-radius:999px}
    #progress>i{display:block;width:0;height:100%;background:#8ff5d0;transition:width .15s linear}
    #warning{position:absolute;z-index:30;left:50%;top:12px;transform:translateX(-50%);width:min(760px,calc(100% - 24px))}
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="warning"></div>
  </div>

  <div id="status">
    <div class="status-card">
      <p class="eyebrow">UNITY WEBGL / PORTFOLIO HOST</p>
      <h1 id="status-title">ĐANG ĐỌC BUILD...</h1>
      <p id="status-text">Đang chuẩn bị Unity WebGL.</p>
      <div id="progress"><i></i></div>
    </div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const game = (params.get('game') || '').replace(/[^a-z0-9-]/gi, '');
      const status = document.getElementById('status');
      const statusTitle = document.getElementById('status-title');
      const statusText = document.getElementById('status-text');
      const progress = document.querySelector('#progress > i');
      const canvas = document.getElementById('unity-canvas');
      const warning = document.getElementById('warning');

      if (!game) {
        statusTitle.textContent = 'THIẾU TÊN GAME';
        statusText.textContent = 'URL cần có ?game=ten-thu-muc.';
        return;
      }

      let muted = true;
      const audioContexts = new Set();
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;

      if (NativeAudioContext) {
        const WrappedAudioContext = function(...args) {
          const context = new NativeAudioContext(...args);
          audioContexts.add(context);
          if (muted) {
            Promise.resolve().then(() => context.suspend()).catch(() => {});
          }
          return context;
        };

        WrappedAudioContext.prototype = NativeAudioContext.prototype;
        Object.setPrototypeOf(WrappedAudioContext, NativeAudioContext);
        window.AudioContext = WrappedAudioContext;
        if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
      }

      function applyAudioState(nextMuted) {
        muted = Boolean(nextMuted);
        audioContexts.forEach((context) => {
          const action = muted ? context.suspend() : context.resume();
          if (action?.catch) action.catch(() => {});
        });
      }

      window.addEventListener('message', (event) => {
        if (event.data?.type !== 'portfolio-game-audio') return;
        applyAudioState(event.data.muted);
      });

      function banner(message, type) {
        const item = document.createElement('div');
        item.textContent = message;
        item.style.cssText =
          'padding:10px 12px;margin-bottom:6px;border-radius:10px;font:12px/1.5 monospace;' +
          (type === 'error'
            ? 'background:#551820;color:#ffdce2'
            : 'background:#4b3d12;color:#fff0bd');
        warning.appendChild(item);
        if (type !== 'error') setTimeout(() => item.remove(), 5000);
      }

      function parseQuoted(source, regex, fallback = '') {
        const match = source.match(regex);
        return match ? match[1] : fallback;
      }

      function assetUrl(base, buildDir, file) {
        return new URL(buildDir.replace(/\/$/, '') + '/' + file, base).href;
      }

      async function boot() {
        const pageUrl = new URL('games/' + game + '/index.html', parent.location.href).href;
        statusText.textContent = 'Đang đọc ' + pageUrl;

        const response = await fetch(pageUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('Không tìm thấy games/' + game + '/index.html');

        const source = await response.text();
        const base = new URL('.', pageUrl).href;

        const buildDir = parseQuoted(
          source,
          /var\s+buildUrl\s*=\s*["']([^"']+)["']/,
          'Build'
        );

        const loaderFile = parseQuoted(
          source,
          /var\s+loaderUrl\s*=\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );
        const dataFile = parseQuoted(
          source,
          /dataUrl\s*:\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );
        const frameworkFile = parseQuoted(
          source,
          /frameworkUrl\s*:\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );
        const codeFile = parseQuoted(
          source,
          /codeUrl\s*:\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );

        if (!loaderFile || !dataFile || !frameworkFile || !codeFile) {
          throw new Error('Không đọc được tên file Build từ Unity index.html.');
        }

        const companyName = parseQuoted(source, /companyName\s*:\s*["']([^"']*)["']/, 'Portfolio');
        const productName = parseQuoted(source, /productName\s*:\s*["']([^"']*)["']/, game);
        const productVersion = parseQuoted(source, /productVersion\s*:\s*["']([^"']*)["']/, '1.0');

        const config = {
          arguments: [],
          dataUrl: assetUrl(base, buildDir, dataFile),
          frameworkUrl: assetUrl(base, buildDir, frameworkFile),
          codeUrl: assetUrl(base, buildDir, codeFile),
          streamingAssetsUrl: new URL('StreamingAssets', base).href,
          companyName,
          productName,
          productVersion,
          showBanner: banner,
          cacheControl(url) {
            if (/\.(data|wasm|framework\.js)(\?|$)/.test(url)) return 'immutable';
            return 'must-revalidate';
          }
        };

        const script = document.createElement('script');
        script.src = assetUrl(base, buildDir, loaderFile);
        script.onload = async () => {
          try {
            const instance = await createUnityInstance(canvas, config, (value) => {
              progress.style.width = Math.round(value * 100) + '%';
            });

            window.__portfolioUnityInstance = instance;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            status.hidden = true;
            applyAudioState(true);
            parent.postMessage({ type: 'portfolio-game-ready', game }, '*');
          } catch (error) {
            throw error;
          }
        };
        script.onerror = () => {
          statusTitle.textContent = 'KHÔNG TẢI ĐƯỢC UNITY LOADER';
          statusText.textContent = loaderFile;
        };
        document.body.appendChild(script);
      }

      boot().catch((error) => {
        statusTitle.textContent = 'KHÔNG THỂ KHỞI ĐỘNG GAME';
        statusText.textContent = error?.message || String(error);
        console.error(error);
      });
    })();
  </script>
</body>
</html>
