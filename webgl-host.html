<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>Portfolio WebGL Host</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070a}
    body{font-family:Arial,sans-serif;color:#f3f7f4}
    #unity-container{position:absolute;inset:0;width:100%;height:100%;background:#05070a}
    #unity-canvas{display:block;width:100%!important;height:100%!important;background:#05070a}
    #status{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#05070a}
    #status[hidden]{display:none}
    .status-card{width:min(520px,100%);padding:24px;border:1px solid #ffffff18;border-radius:18px;background:#0b1017;text-align:center}
    #status-title{margin:0 0 10px;font:700 clamp(24px,5vw,42px)/1.05 Arial,sans-serif;letter-spacing:-.03em}
    #status-text{margin:0;color:#8995a6;font-size:13px;line-height:1.6}
    #progress-value{display:block;margin-top:14px;color:#8ff5d0;font:700 12px/1 monospace;letter-spacing:.08em}
    #progress{height:3px;margin-top:10px;background:#ffffff10;overflow:hidden;border-radius:999px}
    #progress>i{display:block;width:0;height:100%;background:#8ff5d0;transition:width .15s linear}
    #warning{position:absolute;z-index:30;left:50%;top:12px;transform:translateX(-50%);width:min(760px,calc(100% - 24px))}
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="warning"></div>
  </div>

  <div id="status">
    <div class="status-card">
      <h1 id="status-title">TRÒ CHƠI</h1>
      <p id="status-text">Đang khởi động trò chơi...</p>
      <strong id="progress-value">0%</strong>
      <div id="progress"><i></i></div>
    </div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const game = (params.get('game') || '').replace(/[^a-z0-9-]/gi, '');
      const status = document.getElementById('status');
      const statusTitle = document.getElementById('status-title');
      const statusText = document.getElementById('status-text');
      const progressValue = document.getElementById('progress-value');
      const progress = document.querySelector('#progress > i');
      const canvas = document.getElementById('unity-canvas');
      const warning = document.getElementById('warning');

      const fallbackNames = {
        'oops-brake': 'OOPS BRAKE',
        'lat-hinh-tim-cap': 'LẬT HÌNH TÌM CẶP'
      };

      statusTitle.textContent =
        fallbackNames[game] ||
        game.replace(/-/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase());

      if (!game) {
        statusTitle.textContent = 'KHÔNG TÌM THẤY TRÒ CHƠI';
        statusText.textContent = 'Không thể xác định trò chơi.';
        progressValue.textContent = '—';
        return;
      }

      let muted = true;
      const audioContexts = new Set();
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
      const nativeResume = NativeAudioContext?.prototype?.resume;
      const nativeSuspend = NativeAudioContext?.prototype?.suspend;

      if (NativeAudioContext && nativeResume && nativeSuspend) {
        // Unity may call AudioContext.resume() by itself after loading.
        // While the portfolio is muted we deliberately refuse those resumes.
        NativeAudioContext.prototype.resume = function() {
          audioContexts.add(this);
          if (muted) return Promise.resolve();
          return nativeResume.call(this);
        };

        const WrappedAudioContext = function(...args) {
          const context = new NativeAudioContext(...args);
          audioContexts.add(context);

          Promise.resolve()
            .then(() => nativeSuspend.call(context))
            .catch(() => {});

          return context;
        };

        WrappedAudioContext.prototype = NativeAudioContext.prototype;
        Object.setPrototypeOf(WrappedAudioContext, NativeAudioContext);

        try {
          window.AudioContext = WrappedAudioContext;
          if (window.webkitAudioContext) {
            window.webkitAudioContext = WrappedAudioContext;
          }
        } catch {
          // Prototype resume guard above still keeps Unity muted.
        }
      }

      const nativeMediaPlay = window.HTMLMediaElement?.prototype?.play;
      if (nativeMediaPlay) {
        window.HTMLMediaElement.prototype.play = function(...args) {
          this.muted = muted;
          return nativeMediaPlay.apply(this, args);
        };
      }

      function applyAudioState(nextMuted) {
        muted = Boolean(nextMuted);

        audioContexts.forEach((context) => {
          const action = muted
            ? nativeSuspend?.call(context)
            : nativeResume?.call(context);

          if (action?.catch) action.catch(() => {});
        });

        document.querySelectorAll('audio,video').forEach((media) => {
          media.muted = muted;
        });
      }

      window.addEventListener('message', (event) => {
        if (event.data?.type !== 'portfolio-game-audio') return;
        applyAudioState(event.data.muted);
      });

      function banner(message, type) {
        const item = document.createElement('div');
        item.textContent = message;
        item.style.cssText =
          'padding:10px 12px;margin-bottom:6px;border-radius:10px;font:12px/1.5 monospace;' +
          (type === 'error'
            ? 'background:#551820;color:#ffdce2'
            : 'background:#4b3d12;color:#fff0bd');
        warning.appendChild(item);
        if (type !== 'error') setTimeout(() => item.remove(), 5000);
      }

      function parseQuoted(source, regex, fallback = '') {
        const match = source.match(regex);
        return match ? match[1] : fallback;
      }

      function assetUrl(base, buildDir, file) {
        return new URL(buildDir.replace(/\/$/, '') + '/' + file, base).href;
      }

      async function boot() {
        const pageUrl = new URL('games/' + game + '/index.html', parent.location.href).href;
        statusText.textContent = 'Đang khởi động trò chơi...';
        progressValue.textContent = '0%';

        const response = await fetch(pageUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('Không tìm thấy games/' + game + '/index.html');

        const source = await response.text();
        const base = new URL('.', pageUrl).href;

        const buildDir = parseQuoted(
          source,
          /var\s+buildUrl\s*=\s*["']([^"']+)["']/,
          'Build'
        );

        const loaderFile = parseQuoted(
          source,
          /var\s+loaderUrl\s*=\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );
        const dataFile = parseQuoted(
          source,
          /dataUrl\s*:\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );
        const frameworkFile = parseQuoted(
          source,
          /frameworkUrl\s*:\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );
        const codeFile = parseQuoted(
          source,
          /codeUrl\s*:\s*buildUrl\s*\+\s*["']\/([^"']+)["']/
        );

        if (!loaderFile || !dataFile || !frameworkFile || !codeFile) {
          throw new Error('Không đọc được tên file Build từ Unity index.html.');
        }

        const companyName = parseQuoted(source, /companyName\s*:\s*["']([^"']*)["']/, 'Portfolio');
        const productName = parseQuoted(source, /productName\s*:\s*["']([^"']*)["']/, game);
        const productVersion = parseQuoted(source, /productVersion\s*:\s*["']([^"']*)["']/, '1.0');

        if (productName && productName.trim()) {
          statusTitle.textContent = productName.trim().toUpperCase();
        }

        const config = {
          arguments: [],
          dataUrl: assetUrl(base, buildDir, dataFile),
          frameworkUrl: assetUrl(base, buildDir, frameworkFile),
          codeUrl: assetUrl(base, buildDir, codeFile),
          streamingAssetsUrl: new URL('StreamingAssets', base).href,
          companyName,
          productName,
          productVersion,
          showBanner: banner,
          cacheControl(url) {
            if (/\.(data|wasm|framework\.js)(\?|$)/.test(url)) return 'immutable';
            return 'must-revalidate';
          }
        };

        const script = document.createElement('script');
        script.src = assetUrl(base, buildDir, loaderFile);
        script.onload = async () => {
          try {
            applyAudioState(true);
            const muteGuard = window.setInterval(() => applyAudioState(true), 250);

            const instance = await createUnityInstance(canvas, config, (value) => {
              const percent = Math.max(0, Math.min(100, Math.round(value * 100)));
              progress.style.width = percent + '%';
              progressValue.textContent = percent + '%';
            });

            window.clearInterval(muteGuard);
            window.__portfolioUnityInstance = instance;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            status.hidden = true;
            applyAudioState(true);
            parent.postMessage({ type: 'portfolio-game-ready', game }, '*');
          } catch (error) {
            throw error;
          }
        };
        script.onerror = () => {
          statusTitle.textContent = fallbackNames[game] || statusTitle.textContent;
          statusText.textContent = 'Không thể khởi động trò chơi.';
          progressValue.textContent = '—';
        };
        document.body.appendChild(script);
      }

      boot().catch((error) => {
        statusText.textContent = 'Không thể khởi động trò chơi.';
        progressValue.textContent = '—';
        console.error(error);
      });
    })();
  </script>
</body>
</html>
