<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>Oops Brake — WebGL</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#07090d;
      --line:#ffffff18;
      --ink:#f3f7f4;
      --muted:#8995a6;
      --mint:#8ff5d0;
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
    }
    body{
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--ink);
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 50% 20%,#14362d55,transparent 36%),
        linear-gradient(180deg,#0b1118,#06080b);
    }
    .status-card{
      width:min(560px,100%);
      padding:28px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#0b1017dc;
      box-shadow:0 24px 80px #0008;
      text-align:center;
    }
    .eyebrow{
      margin:0 0 10px;
      color:var(--mint);
      font:700 11px/1.4 monospace;
      letter-spacing:.16em;
    }
    h1{
      margin:0 0 12px;
      font-size:clamp(26px,5vw,44px);
      line-height:1;
    }
    p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
    }
    code{color:#dffcf2}
  </style>
</head>
<body>
  <main class="status-card">
    <p class="eyebrow">PLAYABLE BUILD / WEBGL</p>
    <h1 id="statusTitle">ĐANG MỞ GAME...</h1>
    <p id="statusText">Đang kiểm tra <code>games/oops-brake/index.html</code>.</p>
  </main>

  <script>
    (() => {
      const gameUrl = 'games/oops-brake/index.html';
      const title = document.getElementById('statusTitle');
      const text = document.getElementById('statusText');

      fetch(gameUrl, { method: 'GET', cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('Build not found');
          window.location.replace(gameUrl);
        })
        .catch(() => {
          title.textContent = 'CHƯA CÓ BUILD WEBGL';
          text.innerHTML =
            'Upload nguyên build Unity WebGL vào <code>games/oops-brake/</code>. ' +
            'File chính phải là <code>games/oops-brake/index.html</code>.';
        });
    })();
  </script>
</body>
</html>
