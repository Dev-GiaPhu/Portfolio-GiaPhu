<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | LatHinh2D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
      <!-- PORTFOLIO_WEBGL_FIT -->
    <style>
      html,
      body {
        width:100%;
        height:100%;
        margin:0;
        overflow:hidden;
        background:#07090d;
      }

      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position:absolute !important;
        inset:0 !important;
        left:0 !important;
        top:0 !important;
        width:100% !important;
        height:100% !important;
        transform:none !important;
        margin:0 !important;
      }

      #unity-canvas,
      #unity-canvas.unity-mobile {
        display:block;
        width:100% !important;
        height:100% !important;
        max-width:none !important;
        max-height:none !important;
        margin:0 !important;
        background:#07090d;
      }

      #unity-footer {
        display:none !important;
      }

      #unity-loading-bar {
        left:50% !important;
        top:50% !important;
        transform:translate(-50%,-50%) !important;
      }

      
      #web-exit-blocker{
        position:absolute;
        z-index:100;
        left:57%;
        top:70%;
        width:12%;
        height:21%;
        border:0;
        padding:0;
        margin:0;
        background:transparent;
        cursor:not-allowed;
        touch-action:none;
      }

      #web-exit-blocker::after{
        content:"";
        position:absolute;
        inset:0;
        border-radius:18px;
        background:transparent;
      }

      @media(max-width:700px){
        #web-exit-blocker{
          left:56%;
          top:69%;
          width:14%;
          height:23%;
        }
      }

      #unity-warning {
        left:50% !important;
        top:16px !important;
        transform:translateX(-50%) !important;
        width:min(760px,calc(100% - 32px)) !important;
        z-index:30 !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <button
        id="web-exit-blocker"
        type="button"
        aria-label="Nút thoát đã bị vô hiệu hóa trên phiên bản web"
        title="Nút thoát đã bị vô hiệu hóa trên phiên bản web"
      ></button>
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">LatHinh2D</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Web build only: block the in-game red Exit button before Unity receives input.
      // Region is normalized to the canvas, so it keeps working when the game resizes.
      function isWebExitButtonEvent(event) {
        var point = event.touches && event.touches[0]
          ? event.touches[0]
          : event.changedTouches && event.changedTouches[0]
            ? event.changedTouches[0]
            : event;

        if (
          typeof point.clientX !== "number" ||
          typeof point.clientY !== "number"
        ) {
          return false;
        }

        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return false;

        var x = (point.clientX - rect.left) / rect.width;
        var y = (point.clientY - rect.top) / rect.height;

        // Red X button area on the main menu.
        return x >= 0.57 && x <= 0.69 && y >= 0.70 && y <= 0.91;
      }

      function blockWebExitButton(event) {
        if (!isWebExitButtonEvent(event)) return;
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }

      [
        "pointerdown",
        "pointerup",
        "mousedown",
        "mouseup",
        "click",
        "touchstart",
        "touchend"
      ].forEach(function(type) {
        document.addEventListener(type, blockWebExitButton, {
          capture: true,
          passive: false
        });
      });
      var webExitBlocker = document.querySelector("#web-exit-blocker");

      function blockWebExitEvent(event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }

      ["pointerdown","pointerup","mousedown","mouseup","click","touchstart","touchend"].forEach(function(type) {
        webExitBlocker.addEventListener(type, blockWebExitEvent, { capture: true, passive: false });
      });

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js?v=20261001-2218";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data",
        frameworkUrl: buildUrl + "/Web.framework.js",
        codeUrl: buildUrl + "/Web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "LatHinh2D",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        cacheControl: function(url) {
          if (
            url.endsWith(".data") ||
            url.endsWith(".wasm") ||
            url.endsWith(".framework.js")
          ) {
            return "immutable";
          }
          return "must-revalidate";
        },
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
